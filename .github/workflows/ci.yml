# Schnelle Rückmeldung bei jedem Push: Typprüfung, Build, Testsuite und der
# Selbsttest der Desktop-Fassung. Baut bewusst KEINE Installationspakete —
# das erledigt release.yml beim Setzen eines Versions-Tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Electron startet unter Linux über einen SUID-Sandbox-Helfer, der root
      # gehören und das setuid-Bit tragen muss. Beim Auspacken durch npm bleibt
      # er beim Runner-Benutzer, und der Selbsttest bricht mit SIGTRAP ab.
      # Die Rechte nachzuziehen ist dem Abschalten per `--no-sandbox`
      # vorzuziehen: sonst prüfte der Selbsttest eine Konfiguration, die es
      # bei den Nutzern gar nicht gibt.
      - name: Electron-Sandbox scharfschalten
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Typprüfung und Produktions-Build
        run: npm run build

      - name: Testsuite
        run: npm test

      # Der Selbsttest startet ein echtes Electron-Fenster. Auf dem Runner gibt
      # es keinen Bildschirm, deshalb über einen virtuellen X-Server.
      - name: Selbsttest der Desktop-Fassung
        run: xvfb-run -a npm run smoke
