<title>ÖAI · STOCHASI v2</title>
<script>
/* Setzt Hell/Dunkel vor dem CSS-Paint (kein Aufblitzen). Spiegelt core/theme.ts. */
(function(){try{var t=localStorage.getItem("stochasi.theme");
if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<!-- Schriften werden lokal mitgeliefert (src/fonts.css); kein Fremdserver-Aufruf. -->
